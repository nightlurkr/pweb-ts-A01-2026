<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Antrian RS</title>
    <link rel="stylesheet" href="./css/style.css" />
    <script src="./dist/storage.js" defer></script>
    <script src="./dist/dom.js" defer></script>
    <script src="./dist/login.js" defer></script>
  </head>

  <body class="login-body">
    <main class="login-card">
      <header class="login-header">
        <h1>Antrian Rumah Sakit</h1>
        <p>Masuk sebagai petugas</p>
      </header>

      <div id="error-box" class="alert alert-error" role="alert" hidden></div>

      <form id="login-form" class="login-form" novalidate>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="emilys"
                 autocomplete="username" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="........"
                 autocomplete="current-password" required />
        </div>

        <button type="submit" id="login-button" class="btn">
          <span id="login-button-text">Masuk</span>
          <span id="login-spinner" class="spinner" hidden></span>
        </button>
      </form>

      <footer class="login-footer">
        Pengunjung juga login di sini untuk mengambil nomor antrian.
        <a href="./layar.html">Lihat layar antrian</a> tanpa login.
      </footer>
    </main>
  </body>
</html>
